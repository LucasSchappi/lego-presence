<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Presence · Phone</title>
<link rel="stylesheet" href="style.css">
<style>
  #grid { position: fixed; inset: 0; display: grid; gap: 2px; background: #000; }
  .tile { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  .tile video { width: 100%; height: 100%; object-fit: cover; }
  .tile .name {
    position: absolute; left: 10px; bottom: 10px; padding: 2px 10px; border-radius: 99px;
    background: rgba(0,0,0,.55); font-size: 0.9rem;
  }
  .tile .name:empty { display: none; }
  #self {
    position: fixed; right: 12px; bottom: 12px; width: 22vw; max-width: 140px;
    border-radius: 10px; border: 2px solid rgba(255,255,255,.4); transform: scaleX(-1);
  }
  #idle { position: fixed; inset: 0; }
  .top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; }
</style>
</head>
<body>
<form id="room-form" class="center" hidden>
  <div class="card">
    <h1>📱 Phone</h1>
    <p>Enter the room name.</p>
    <div class="row"><input name="room" autocomplete="off" required><button class="primary">Go</button></div>
  </div>
</form>

<div id="app">
  <div id="grid"></div>
  <video id="self" autoplay playsinline muted hidden></video>

  <div id="idle" class="center">
    <div class="card">
      <h1>📱 Phone · <span data-room></span></h1>
      <p id="idle-text">Tap start to turn on the camera and wait for the remote person.</p>
      <button id="start" class="primary">Start</button>
      <p class="note" id="bt-note" hidden style="color:var(--muted);font-size:0.85rem;margin:14px 0 0"></p>
    </div>
  </div>

  <div class="top chips">
    <span class="chip" id="sig">Offline</span>
    <span class="chip" id="call">No call</span>
    <span class="chip" id="stand" hidden>Stand</span>
    <button id="bt" class="chip" hidden>🔵 Connect stand</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="stand.js"></script>
<script>
const room = getRoomOrShowForm();
const grid = document.getElementById('grid');
const selfVideo = document.getElementById('self');
const idle = document.getElementById('idle');
const idleText = document.getElementById('idle-text');
let localStream = null;
const MAX_DRIVERS = 4;
const TOTAL_BITRATE = 1_200_000; // shared between drivers so the phone's upload doesn't choke
const calls = new Map();         // driver peer id → { call, tile, setBitrate, live }
const diagConns = new Map();     // driver peer id → data connection
const driverNames = new Map();   // driver peer id → name
const turnedAway = new Map();    // driver peer id → time we last refused them (phone full)

function showIdle(text) {
  idle.hidden = false;
  idleText.textContent = text;
  document.getElementById('start').hidden = true;
}

document.getElementById('start').addEventListener('click', async () => {
  try {
    localStream = await getCameraAndMic('motion'); // the stand turns, so this camera moves
  } catch (err) {
    idleText.textContent = `Camera/mic blocked: ${err.message}. Allow access and reload.`;
    return;
  }
  selfVideo.srcObject = localStream;
  selfVideo.hidden = false;
  keepAwake();
  document.documentElement.requestFullscreen?.().catch(() => {});
  showIdle('Waiting for the remote person to call…');
  await iceReady;
  connect();
});

function connect() {
  makeFixedPeer(peerIds(room).phone, (t, st) => setChip('sig', t, st), (peer) => {
    setChip('sig', 'Connecting…', 'wait');
    peer.on('open', () => setChip('sig', 'Online', 'ok'));
    peer.on('call', onCall);
    peer.on('connection', onDiagConnection);
  });
}

function onCall(call) {
  const id = call.peer;
  const name = String(call.metadata?.name || '').slice(0, 30);
  diag.log(`incoming call from ${name || id.slice(0, 8)} (${calls.size} already)`);

  // The same driver redialling replaces its own old call; anyone else joins the grid.
  const previous = calls.get(id);
  if (!previous && calls.size >= MAX_DRIVERS) {
    diag.log('phone full, turning caller away');
    turnedAway.set(id, Date.now());
    diagConns.get(id)?.send({ type: 'full', max: MAX_DRIVERS });
    call.close();
    return;
  }
  turnedAway.delete(id);
  if (previous) {
    calls.delete(id);
    previous.call.close();
  }

  const tile = previous?.tile || makeTile();
  tile.querySelector('.name').textContent = name;
  driverNames.set(id, name);
  const entry = { call, tile, live: false, setBitrate: null };
  calls.set(id, entry);

  call.answer(localStream);
  entry.setBitrate = tuneVideo(call, TOTAL_BITRATE);
  logConnection(call.peerConnection, `call[${name || id.slice(0, 8)}]`);
  layout();

  onCallConnected(call, (stream) => {
    if (calls.get(id) !== entry) return;
    entry.live = true;
    const video = tile.querySelector('video');
    video.srcObject = stream;
    video.play().catch(() => {});
    layout();
  });

  const end = (why) => {
    if (calls.get(id) !== entry) return;
    diag.log(`call from ${name || id.slice(0, 8)} ended (${why})`);
    calls.delete(id);
    tile.remove();
    layout();
  };
  call.on('close', () => end('closed'));
  call.on('error', (err) => end(`error ${err.type}`));
  // PeerJS doesn't always fire 'close' when the other side vanishes; watch ICE too.
  watchIce(call, () => { end('connection lost'); call.close(); });
}

function makeTile() {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.innerHTML = '<video autoplay playsinline></video><span class="name"></span>';
  grid.append(tile);
  return tile;
}

// Splits the screen between everyone connected, and shares the upload between them.
function layout() {
  const n = grid.children.length;
  const live = [...calls.values()].filter((c) => c.live).length;
  if (n) {
    const landscape = innerWidth >= innerHeight;
    const cols = landscape ? Math.ceil(Math.sqrt(n)) : Math.ceil(n / Math.ceil(Math.sqrt(n)));
    const rows = Math.ceil(n / cols);
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  }
  const each = Math.max(300_000, Math.round(TOTAL_BITRATE / Math.max(1, calls.size)));
  calls.forEach((c) => c.setBitrate?.(each));

  if (live) {
    idle.hidden = true;
    setChip('call', live === 1 ? 'In call' : `In call · ${live} drivers`, 'ok');
  } else if (calls.size) {
    setChip('call', 'Connecting…', 'wait');
  } else {
    setChip('call', 'No call', 'bad');
    if (localStream) showIdle('Waiting for the remote person to call…');
  }
}
addEventListener('resize', layout);

// ---- Driving the stand from this phone -------------------------------------
// Only possible where the browser has Web Bluetooth: Chrome on Android, or an app like
// Bluefy on iPhone. Otherwise the computer page (base.html) does this job.

const link = new MicrobitLink({
  log: (m) => diag.log(m),
  onStatus: (ready, text) => {
    setChip('stand', `Stand: ${text}`, ready ? 'ok' : 'bad');
    document.getElementById('stand').hidden = false;
    document.getElementById('bt').hidden = ready;
    broadcastStand();
  },
});

const stand = new StandControl({
  output: {
    start: (dir) => link.sendText(MBIT_COMMANDS[dir]),
    stop: () => link.sendText(MBIT_COMMANDS.stop),
  },
  log: (m) => diag.log(m),
  onChange: broadcastStand,
});

if (MicrobitLink.supported) {
  document.getElementById('bt').hidden = false;
} else {
  const note = document.getElementById('bt-note');
  note.hidden = false;
  note.textContent = 'This browser can\'t do Bluetooth, so the computer page drives the stand. '
    + 'For the phone to drive it, open this page in Chrome (Android) or Bluefy (iPhone).';
}

document.getElementById('bt').addEventListener('click', async () => {
  try {
    await link.connect();
  } catch (err) {
    diag.log(`Bluetooth: ${err.message}`);
    setChip('stand', `Stand: ${err.message}`, 'bad');
    document.getElementById('stand').hidden = false;
  }
});

function broadcastStand() {
  const msg = {
    type: 'stand',
    from: 'phone',
    ready: link.ready,
    text: link.text,
    controller: stand.controller ? driverNames.get(stand.controller) || 'someone' : null,
    controllerId: stand.controller,
  };
  diagConns.forEach((conn) => conn.open && conn.send(msg));
}

// The drive page opens one data connection for diagnostics, driving commands and status.
function onDiagConnection(conn) {
  if (conn.metadata?.kind !== 'diag') return conn.close();
  const push = (line) => conn.open && conn.send({ type: 'diag', line });
  const cleanup = () => {
    diag.listeners.delete(push);
    stand.stop(conn.peer); // don't leave the stand turning if they vanish mid-press
    if (diagConns.get(conn.peer) === conn) diagConns.delete(conn.peer);
  };
  conn.on('data', (msg) => {
    if (diagConns.get(conn.peer) !== conn) return;
    if (msg?.type === 'move') stand.move(conn.peer, msg.dir, msg.press !== false);
    else if (msg?.type === 'stop') stand.stop(conn.peer);
  });
  conn.on('open', () => {
    diagConns.get(conn.peer)?.close();
    diagConns.set(conn.peer, conn);
    conn.send({ type: 'diag-all', lines: diag.lines });
    broadcastStand();
    // Their log link can open after we refused the call, so tell them now.
    if (Date.now() - (turnedAway.get(conn.peer) || 0) < 30000 && !calls.has(conn.peer)) {
      conn.send({ type: 'full', max: MAX_DRIVERS });
    }
    diag.listeners.add(push);
  });
  conn.on('close', cleanup);
  conn.on('error', cleanup);
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Presence · Phone</title>
<link rel="stylesheet" href="style.css">
<style>
  #remote { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #self {
    position: fixed; right: 12px; bottom: 12px; width: 22vw; max-width: 140px;
    border-radius: 10px; border: 2px solid rgba(255,255,255,.4); transform: scaleX(-1);
  }
  #idle { position: fixed; inset: 0; }
  .top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; }
</style>
</head>
<body>
<form id="room-form" class="center" hidden>
  <div class="card">
    <h1>📱 Phone</h1>
    <p>Enter the room name.</p>
    <div class="row"><input name="room" autocomplete="off" required><button class="primary">Go</button></div>
  </div>
</form>

<div id="app">
  <video id="remote" autoplay playsinline></video>
  <video id="self" autoplay playsinline muted hidden></video>

  <div id="idle" class="center">
    <div class="card">
      <h1>📱 Phone · <span data-room></span></h1>
      <p id="idle-text">Tap start to turn on the camera and wait for the remote person.</p>
      <button id="start" class="primary">Start</button>
    </div>
  </div>

  <div class="top chips">
    <span class="chip" id="sig">Offline</span>
    <span class="chip" id="call">No call</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="common.js"></script>
<script>
const room = getRoomOrShowForm();
const remoteVideo = document.getElementById('remote');
const selfVideo = document.getElementById('self');
const idle = document.getElementById('idle');
const idleText = document.getElementById('idle-text');
let localStream = null;
let currentCall = null;

function showIdle(text) {
  idle.hidden = false;
  idleText.textContent = text;
  document.getElementById('start').hidden = true;
}

document.getElementById('start').addEventListener('click', async () => {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch (err) {
    idleText.textContent = `Camera/mic blocked: ${err.message}. Allow access and reload.`;
    return;
  }
  selfVideo.srcObject = localStream;
  selfVideo.hidden = false;
  keepAwake();
  document.documentElement.requestFullscreen?.().catch(() => {});
  showIdle('Waiting for the remote person to call…');
  connect();
});

function connect() {
  const peer = makePeer(peerIds(room).phone, (t, s) => setChip('sig', t, s));
  setChip('sig', 'Connecting…', 'wait');

  peer.on('open', () => setChip('sig', 'Online', 'ok'));

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      setChip('sig', 'Room busy', 'bad');
      showIdle('Another phone is already using this room. Close it or pick another room.');
      peer.destroy();
    } else {
      console.warn(err);
    }
  });

  peer.on('call', (call) => {
    // Only one caller at a time: the newest wins.
    if (currentCall) currentCall.close();
    currentCall = call;
    setChip('call', 'Incoming…', 'wait');
    call.answer(localStream);

    call.on('stream', (stream) => {
      if (call !== currentCall) return;
      remoteVideo.srcObject = stream;
      remoteVideo.play().catch(() => {});
      idle.hidden = true;
      setChip('call', 'In call', 'ok');
    });

    const end = () => {
      if (call !== currentCall) return;
      currentCall = null;
      remoteVideo.srcObject = null;
      setChip('call', 'No call', 'bad');
      showIdle('Call ended. Waiting for the remote person to call…');
    };
    call.on('close', end);
    call.on('error', end);
    // PeerJS doesn't always fire 'close' when the other side vanishes; watch ICE too.
    watchIce(call, () => { end(); call.close(); });
  });
}
</script>
</body>
</html>

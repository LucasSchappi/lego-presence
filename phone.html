<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Presence · Phone</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: #000; }
  #idle { position: fixed; inset: 0; }
  .top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; }
</style>
</head>
<body>
<form id="room-form" class="center" hidden>
  <div class="card">
    <h1>📱 Phone</h1>
    <p>Enter the room name.</p>
    <div class="row"><input name="room" autocomplete="off" required><button class="primary">Go</button></div>
  </div>
</form>

<div id="app">
  <div id="idle" class="center">
    <div class="card">
      <h1>📱 Phone · <span data-room></span></h1>
      <p>Tap start to keep the screen on and let drivers connect.</p>
      <button id="start" class="primary">Start</button>
      <p class="note" id="bt-note" hidden style="color:var(--muted);font-size:0.85rem;margin:14px 0 0"></p>
    </div>
  </div>

  <div class="top chips">
    <span class="chip" id="sig">Offline</span>
    <span class="chip" id="drivers">No drivers</span>
    <span class="chip" id="stand" hidden>Stand</span>
    <button id="bt" class="chip" hidden>🔵 Connect stand</button>
    <button id="auto" class="chip" hidden>🎲 Auto: off</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="stand.js"></script>
<script>
const room = getRoomOrShowForm();
const drivers = new Map();     // driver peer id → { conn, name, seen }
const driverNames = new Map([[StandAuto.ID, '🎲 Auto']]);
const DRIVER_TIMEOUT_MS = 4000; // drivers ping every second; closing a tab can take PeerJS ~30s to notice

document.getElementById('start').addEventListener('click', async () => {
  document.getElementById('idle').hidden = true;
  keepAwake();
  document.documentElement.requestFullscreen?.().catch(() => {});
  await iceReady;
  makeFixedPeer(peerIds(room).phone, (t, st) => setChip('sig', t, st), (peer) => {
    setChip('sig', 'Connecting…', 'wait');
    peer.on('open', () => setChip('sig', 'Online', 'ok'));
    peer.on('connection', onDriverConnection);
  });
});

// ---- Driving the stand from this phone -------------------------------------
// Only possible where the browser has Web Bluetooth: Chrome on Android, or an app like
// Bluefy on iPhone. Otherwise the computer page (base.html) does this job.

const link = new MicrobitLink({
  log: (m) => diag.log(m),
  onStatus: (ready, text) => {
    setChip('stand', `Stand: ${text}`, ready ? 'ok' : 'bad');
    document.getElementById('stand').hidden = false;
    document.getElementById('bt').hidden = ready;
    showAuto();
    broadcastStand();
  },
});

const stand = new StandControl({
  output: {
    start: (dir) => link.sendText(MBIT.move.keys[dir]),
    stop: () => link.sendText(MBIT.move.release),
  },
  log: (m) => diag.log(m),
  onChange: broadcastStand,
});

const piano = new StandControl({
  keys: Object.keys(MBIT.note.keys),
  output: {
    start: (note) => link.sendText(MBIT.note.keys[note]),
    stop: () => link.sendText(MBIT.note.release),
  },
  log: (m) => diag.log(m),
});

const taps = new StandTaps({
  send: (text) => link.sendText(text),
  log: (m) => diag.log(m),
  onChange: broadcastStand,
});

// Auto runs here on the phone, so it works with no driver and no computer.
const auto = new StandAuto({
  stand,
  taps,
  log: (m) => diag.log(m),
  onChange: () => {
    showAuto();
    broadcastStand();
  },
});

function showAuto() {
  const btn = document.getElementById('auto');
  btn.hidden = !link.ready && !auto.on;
  setChip('auto', `🎲 Auto: ${auto.on ? 'on' : 'off'}`, auto.on ? 'ok' : '');
}

document.getElementById('auto').addEventListener('click', () => {
  auto.set(!auto.on);
  if (auto.on) keepAwake(); // the routine stops if the screen sleeps
});

if (MicrobitLink.supported) {
  document.getElementById('bt').hidden = false;
} else {
  const note = document.getElementById('bt-note');
  note.hidden = false;
  note.textContent = 'This browser can\'t do Bluetooth, so the computer page drives the stand. '
    + 'For the phone to drive it, open this page in Chrome (Android) or Bluefy (iPhone).';
}

document.getElementById('bt').addEventListener('click', async () => {
  try {
    await link.connect();
  } catch (err) {
    diag.log(`Bluetooth: ${err.message}`);
    setChip('stand', `Stand: ${err.message}`, 'bad');
    document.getElementById('stand').hidden = false;
  }
});

function broadcastStand() {
  const msg = {
    type: 'stand',
    from: 'phone',
    ready: link.ready,
    text: link.text,
    drivers: drivers.size,
    controller: stand.controller ? driverNames.get(stand.controller) || 'someone' : null,
    controllerId: stand.controller,
    switches: taps.on,
    auto: auto.on,
  };
  drivers.forEach(({ conn }) => conn.open && conn.send(msg));
  setChip('drivers', drivers.size ? `${drivers.size} driver${drivers.size > 1 ? 's' : ''}` : 'No drivers',
    drivers.size ? 'ok' : '');
}

// ---- Remote drivers --------------------------------------------------------
// Each drive page opens one data connection for driving commands, status and diagnostics.

function onDriverConnection(conn) {
  if (conn.metadata?.kind !== 'driver') return conn.close();
  const id = conn.peer;
  const push = (line) => conn.open && conn.send({ type: 'diag', line });
  const cleanup = () => {
    diag.listeners.delete(push);
    if (drivers.get(id)?.conn !== conn) return;
    diag.log(`${driverNames.get(id) || 'a driver'} left`);
    stand.stop(id); // don't leave the stand moving if they vanish mid-press
    piano.stop(id);
    drivers.delete(id);
    if (!drivers.size) taps.turnOff('mode'); // nobody is watching it drive itself
    broadcastStand();
  };
  conn.on('data', (msg) => {
    const d = drivers.get(id);
    if (d?.conn !== conn) return;
    d.seen = Date.now();
    if (msg?.type === 'move') {
      if (auto.on && msg.press !== false) auto.set(false); // a driver steering takes over from Auto
      stand.move(id, msg.dir, msg.press !== false);
    } else if (msg?.type === 'stop') stand.stop(id);
    else if (msg?.type === 'note') piano.move(id, msg.key, msg.press !== false);
    else if (msg?.type === 'note-stop') piano.stop(id);
    else if (msg?.type === 'tap') taps.tap(msg.key);
    else if (msg?.type === 'auto' && !!msg.on !== auto.on) {
      auto.set(!!msg.on);
      if (auto.on) keepAwake();
    }
  });
  conn.on('open', () => {
    // The same driver reconnecting replaces its old link; anyone else is added.
    const old = drivers.get(id);
    driverNames.set(id, String(conn.metadata?.name || '').slice(0, 30));
    drivers.set(id, { conn, seen: Date.now() });
    old?.conn.close();
    diag.log(`${driverNames.get(id) || 'a driver'} connected`);
    conn.send({ type: 'diag-all', lines: diag.lines });
    diag.listeners.add(push);
    broadcastStand();
  });
  conn.on('close', cleanup);
  conn.on('error', cleanup);
}

setInterval(() => {
  drivers.forEach((d, id) => {
    if (Date.now() - d.seen > DRIVER_TIMEOUT_MS) {
      diag.log(`${driverNames.get(id) || 'a driver'} stopped responding`);
      d.conn.close();
    }
  });
}, 1000);
</script>
</body>
</html>
